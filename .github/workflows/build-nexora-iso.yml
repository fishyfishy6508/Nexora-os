name: Build Nexora OS ISO
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out Nexora source
        uses: actions/checkout@v4

      - name: Verify source scripts
        run: |
          bash -n build.sh
          test -f config/package-lists/nexora.list.chroot
          test -f config/includes.chroot/usr/share/backgrounds/nexora/nexora-wallpaper.svg

      - name: Build Debian 13 ISO environment
        run: docker build -t nexora-os-builder:0.1.0 .

      - name: Build bootable live ISO
        run: |
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            nexora-os-builder:0.1.0 \
            bash /work/build.sh



      - name: Check generated image
        run: |
          test -s dist/NexoraOS-0.1.0-amd64.iso
          expected=$(awk '{print $1}' dist/NexoraOS-0.1.0-amd64.iso.sha256)
          actual=$(sha256sum dist/NexoraOS-0.1.0-amd64.iso | awk '{print $1}')
          test "$expected" = "$actual"
          ls -lh dist



      - name: Publish ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexoraOS-0.1.0-amd64-ISO
          path: |
            dist/NexoraOS-0.1.0-amd64.iso
            dist/NexoraOS-0.1.0-amd64.iso.sha256
            dist/boot-report.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
